<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Город в приложении — квест Skill Route</title>
<meta name="description" content="Квест для будущих продуктовых дизайнеров: исследования, прототипы, юзабилити-тесты и доступность. Узнайте, кто такой продуктовый дизайнер.">
<meta property="og:title" content="Город в приложении — квест Skill Route">
<meta property="og:description" content="Вы — продуктовый дизайнер городского приложения. Три кейса, споры с маркетингом и гейм-овер за тёмные паттерны.">
<meta name="theme-color" content="#ff5fa8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5fa8'/%3E%3Crect x='20' y='10' width='24' height='44' rx='6' fill='none' stroke='%231e1b33' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Rubik:wght@700;800;900&display=swap">
<style>
:root{
  --ink:#1e1b33;--bg:#dff1ff;--paper:#fff;--muted:#56536e;--dim:#7d7a94;
  --sun:#ffd21f;--sun-s:#fff3b8;--pink:#ff5fa8;--pink-s:#ffe1ef;--green:#22b87a;--green-s:#d8f7e8;
  --red:#f04a3a;--red-s:#ffe1dc;--blue:#3d8bff;--blue-s:#dcebff;--violet:#8b6cff;
  --amber:var(--sun);
  --fd:'Rubik','Arial Black',system-ui,sans-serif;--f:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --line:3px solid var(--ink);--sh:5px 5px 0 var(--ink);--sh2:3px 3px 0 var(--ink);
  --panelW:clamp(400px,40vw,590px);--cityH:100vh;color-scheme:light;
}
@supports(height:100dvh){:root{--cityH:100dvh}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.55;font-weight:500}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
svg{max-width:100%}
#city{position:fixed;left:0;top:0;width:100vw;height:var(--cityH);display:block;z-index:0}

.hud{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:calc(var(--panelW) + 32px);display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:900;font-size:19px;letter-spacing:-.01em;margin-right:4px;background:var(--sun);border:var(--line);border-radius:12px;padding:4px 12px 4px 6px;box-shadow:var(--sh2)}
.brand .logo{width:26px;height:26px;border-radius:8px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center}
.brand .logo svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px 0 6px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-family:var(--fd);font-weight:800;font-size:14px;white-space:nowrap;position:relative}
.chip svg{width:20px;height:20px;flex:0 0 20px}
.chip small{font-family:var(--f);font-weight:700;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.chip b{font-variant-numeric:tabular-nums}
.chip.up{background:var(--green-s)}.chip.down{background:var(--red-s)}
.chip.warn{background:var(--red-s);animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg)}}
.sound{cursor:pointer;padding:0 12px}
.sound[aria-pressed="false"]{background:#eee;color:var(--dim)}
.fl{position:absolute;right:2px;top:-16px;font-family:var(--fd);font-weight:900;font-size:13px;pointer-events:none;animation:fl 1.5s ease-out forwards;padding:0 5px;border-radius:6px;background:#fff;border:1.5px solid var(--ink)}
.fl.p{color:var(--green)}.fl.n{color:var(--red)}
@keyframes fl{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1;transform:translateY(-4px) scale(1.12)}100%{opacity:0;transform:translateY(-18px)}}
.sr{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 3px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--ink);text-decoration:none;font-family:var(--fd);font-weight:800;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.sr i{width:22px;height:22px;border-radius:50%;background:var(--green);border:2px solid var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:8.5px}

.cityInfo{position:fixed;z-index:4;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;background:#fff;border:var(--line);border-radius:14px;box-shadow:var(--sh);padding:10px 14px;transform:rotate(-1.2deg)}
.cityInfo .nm{font-family:var(--fd);font-weight:900;font-size:clamp(22px,2.4vw,32px);letter-spacing:-.02em;line-height:1}
.cityInfo .sub{font-weight:700;color:var(--muted);font-size:13px;margin-top:4px}
.dots{display:flex;gap:4px;margin-top:8px}
.dots span{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#fff;transition:background .3s,transform .3s}
.dots span.done{background:var(--green)}.dots span.now{background:var(--sun);transform:scale(1.3)}

.panel{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(14px,env(safe-area-inset-right,0px));width:var(--panelW);background:var(--bg);background-image:radial-gradient(rgba(30,27,51,.07) 1.4px,transparent 1.5px);background-size:18px 18px;border:var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:7px 7px 0 var(--ink)}
.phead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sun);border-bottom:var(--line);min-height:58px}
.phead .ttl{flex:1;min-width:0}
.phead .ttl b{display:block;font-family:var(--fd);font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .ttl small{display:block;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;flex-direction:column;gap:4px;min-width:118px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 8px}
.lvl b{font-family:var(--fd);font-size:12px;font-weight:800;line-height:1.1;white-space:nowrap}
.lvlbar{height:6px;border-radius:3px;background:#eee;border:1.5px solid var(--ink);overflow:hidden}
.lvlbar i{display:block;height:100%;width:0;background:var(--green);transition:width .7s}
.streak{display:flex;align-items:center;gap:3px;font-family:var(--fd);font-weight:900;font-size:13px;padding:4px 9px;border-radius:999px;background:#ffe4d1;border:2px solid var(--ink)}
.streak[data-n="0"]{opacity:.5}
.streak svg{width:16px;height:16px}
#stage{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 20px 44px;display:flex;flex-direction:column;gap:16px;position:relative}
#stage::-webkit-scrollbar{width:10px}#stage::-webkit-scrollbar-thumb{background:var(--ink);border-radius:5px;border:3px solid var(--bg)}
#stage>*{flex-shrink:0;animation:pop .36s cubic-bezier(.3,1.4,.6,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

@media (max-width:899px){
  :root{--cityH:36vh}
  @supports(height:100dvh){:root{--cityH:36dvh}}
  .hud{left:8px;right:8px;top:calc(7px + env(safe-area-inset-top,0px));gap:5px}
  .brand,.sr{display:none}
  .chip{height:29px;padding:0 8px 0 4px;font-size:12.5px;gap:4px;box-shadow:1.5px 1.5px 0 var(--ink)}
  .chip small{display:none}.chip svg{width:16px;height:16px;flex-basis:16px}
  .sound{padding:0 9px}
  .panel{top:calc(var(--cityH) - 14px);left:0;right:0;bottom:0;width:auto;border-radius:20px 20px 0 0;border-bottom:0;border-left:0;border-right:0;box-shadow:none}
  .phead{padding:8px 12px;min-height:50px}
  .lvl{min-width:90px}
  #stage{padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px))}
  .cityInfo{bottom:auto;top:calc(var(--cityH) - 74px);left:10px;padding:6px 10px}
  .cityInfo .nm{font-size:18px}.cityInfo .sub{font-size:11px;margin-top:1px}.dots{display:none}
}

h1,h2,h3,h4{margin:0;line-height:1.1;text-wrap:balance;font-family:var(--fd)}
h1{font-size:clamp(38px,4.4vw,58px);font-weight:900;letter-spacing:-.02em}
h1 span{background:var(--sun);padding:0 .12em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
h2{font-size:clamp(23px,2.3vw,30px);font-weight:900;text-shadow:3px 3px 0 var(--sun)}
h3{font-size:18px;font-weight:800}
p{margin:0}
.chHead{display:flex;flex-direction:column;gap:9px}
.meta{display:flex;gap:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;background:var(--ink);color:var(--sun);font-family:var(--fd);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-1.2deg)}
.tag.g{background:#fff;color:var(--ink);border:2px solid var(--ink);transform:none}
.tag.r{background:var(--red);color:#fff}

.line{display:flex;gap:10px;align-items:flex-end}
.ava{flex:0 0 58px;width:58px;height:58px;border-radius:50%;border:var(--line);background:#fff;overflow:hidden;box-shadow:var(--sh2)}
.ava svg{display:block;width:100%;height:100%}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:var(--line);border-radius:20px;padding:10px 15px 12px;box-shadow:4px 4px 0 var(--ink);margin-bottom:8px}
.bubble::before{content:"";position:absolute;left:-15px;bottom:14px;border:9px solid transparent;border-right:14px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;bottom:17px;border:6px solid transparent;border-right:10px solid #fff;border-left:0}
.who{font-family:var(--fd);font-size:13.5px;font-weight:800;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin-bottom:2px}
.who em{font-style:normal;font-family:var(--f);color:var(--muted);font-weight:600;font-size:12.5px}
.txt{font-size:16.5px;line-height:1.5;font-weight:500}
.txt.typing::after{content:"▍";animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.narr{background:var(--sun);border:var(--line);border-radius:6px;padding:10px 14px;box-shadow:4px 4px 0 var(--ink)}
.narr .txt{font-weight:700}
.hintBox{background:var(--blue-s);border:2.5px dashed var(--blue);border-radius:12px;padding:10px 14px;font-weight:600}
.hintBox b{color:var(--blue)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:var(--line);border-radius:14px;padding:11px 14px;box-shadow:4px 4px 0 var(--ink);font-weight:600;font-size:15.5px;line-height:1.42;transition:transform .1s,box-shadow .1s,background .15s}
.choice:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--sun-s)}
.choice:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.choice:disabled{cursor:default;opacity:.5;box-shadow:2px 2px 0 var(--ink)}
.key{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-size:15px;font-weight:900;background:var(--sun);border:2.5px solid var(--ink)}
.choice.picked{opacity:1}
.choice.ok{background:var(--green-s)}.choice.ok .key{background:var(--green);color:#fff}
.choice.bad{background:var(--red-s)}.choice.bad .key{background:var(--red);color:#fff}
.choice.mid{background:var(--sun-s)}
.choice.right{opacity:1;border-style:dashed;background:var(--green-s)}

.btn{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:var(--line);background:var(--sun);color:var(--ink);font-family:var(--fd);font-weight:800;font-size:15px;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:#fff;font-size:14px}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.big{min-height:52px;font-size:18px;padding:0 26px;font-weight:900}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.fb{border:var(--line);border-radius:18px;padding:16px;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;gap:11px}
.fbTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict{font-family:var(--fd);font-weight:900;font-size:15px;letter-spacing:.02em;text-transform:uppercase;padding:5px 12px;border:2.5px solid var(--ink);border-radius:8px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--ink)}
.fb.ok .verdict{background:var(--green);color:#fff}.fb.bad .verdict{background:var(--red);color:#fff}.fb.mid .verdict{background:var(--sun)}
.xp{font-family:var(--fd);font-weight:900;font-size:14px;color:var(--green)}
.fb p{font-size:15.5px}
.lesson{position:relative;background:var(--sun-s);border:2.5px solid var(--ink);border-radius:6px;padding:15px 14px 12px;margin-top:4px;transform:rotate(.4deg)}
.lesson::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,95,168,.55);border:1.5px solid rgba(30,27,51,.35);transform:rotate(-3deg)}
.lesson span{display:block;font-family:var(--fd);font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#d23f86;margin-bottom:2px}
.lesson p{font-weight:600;font-size:15.5px}

.card{border:var(--line);border-radius:18px;padding:15px;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph small,.cap{font-size:13px;font-weight:600;color:var(--muted)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 46px;gap:10px;align-items:center;font-weight:700;font-size:14.5px}
.track{height:20px;border-radius:999px;background:#eef3f8;border:2.5px solid var(--ink);overflow:hidden}
.fill{height:100%;width:0;background:var(--blue);transition:width 1s cubic-bezier(.3,1.3,.5,1)}
.bar.hot .fill{background:var(--pink)}
.v{font-family:var(--fd);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

.funnel{display:flex;flex-direction:column;gap:3px}
.fstep{display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:6px;border-radius:12px;text-align:left;width:100%}
.fstep:hover:not(:disabled){background:var(--sun-s)}
.fstep:disabled{cursor:default}
.flabel{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px}
.flabel em{font-style:normal;font-family:var(--fd);font-weight:800;font-variant-numeric:tabular-nums}
.ftrack{height:22px}
.fbar{display:block;height:100%;width:0;border-radius:6px;background:var(--blue);border:2.5px solid var(--ink);transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.drop{font-size:13.5px;font-weight:700;color:var(--muted);padding-left:8px;height:0;overflow:hidden;transition:height .3s}
.funnel.revealed .drop{height:20px}.drop.big{color:var(--red)}
.fstep.ok{background:var(--green-s)}.fstep.ok .fbar{background:var(--green)}
.fstep.bad{background:var(--red-s)}.fstep.bad .fbar{background:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.ch{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px;box-shadow:2px 2px 0 var(--ink);text-align:left}
.ch[aria-pressed="true"]{background:var(--sun);transform:rotate(-1.5deg)}
.ch.yes{background:var(--pink-s)}.ch.no{background:var(--green-s)}
.ch.miss{outline:3px dashed var(--red);outline-offset:3px}
.ch:disabled{cursor:default}

.residents{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border:var(--line);border-radius:16px;background:#fff;box-shadow:var(--sh2)}
.res .ava{width:62px;height:62px;flex:none}
.res b{font-family:var(--fd);font-size:14px}.res small{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:9px 12px;font-weight:600;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.q[aria-pressed="true"]{background:var(--sun-s)}
.q .box{flex:0 0 22px;height:22px;border-radius:6px;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:900;background:#fff}
.q[aria-pressed="true"] .box{background:var(--green);color:#fff}
.q:disabled{cursor:default}.q.g{background:var(--green-s)}.q.b{background:var(--red-s)}
.qa{border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:9px;box-shadow:var(--sh2)}
.qa h4{font-size:15px}
.ans{display:flex;gap:9px;align-items:flex-start;font-size:15px}
.ans .mini{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);overflow:hidden}
.ans .mini svg{width:100%;height:100%;display:block}
.qv{align-self:flex-start;font-family:var(--fd);font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px;border:2px solid var(--ink)}
.qv.g{background:var(--green);color:#fff}.qv.b{background:var(--red);color:#fff}.qv.m{background:var(--sun)}

.slots{display:flex;flex-direction:column;gap:12px}
.slot{display:flex;flex-direction:column;gap:7px}
.slot>b{font-family:var(--fd);font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slot .ch{font-size:14px;padding:7px 12px}
.preview{font-size:17px;font-weight:600;line-height:1.55;background:var(--sun-s);border:2.5px solid var(--ink);border-radius:12px;padding:12px 14px}
.preview span{background:#fff;border-bottom:3px solid var(--pink);padding:0 4px;border-radius:3px}
.preview span.empty{color:var(--dim);border-bottom-style:dashed}

.abc{width:100%;height:220px;display:block}
.abmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.abmeta b{font-family:var(--fd)}
.lg{display:inline-block;width:16px;height:6px;border-radius:3px;border:1.5px solid var(--ink);vertical-align:middle;margin-right:6px}
.peek{display:flex;flex-direction:column;gap:10px;background:var(--red-s);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:var(--sh2)}
.peek b{font-family:var(--fd)}

table.dt{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:340px}
.dt th,.dt td{padding:9px 10px;text-align:right;border-bottom:2px solid #e6e3ef}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt th{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.dt td b{font-family:var(--fd);font-weight:800}
.dt tr.tot td{font-weight:800;border-top:2.5px solid var(--ink)}
.up{color:#168a5a}.dn{color:var(--red)}
.heat td.c{text-align:center;font-weight:800;color:var(--ink)}

.toggle{display:inline-flex;align-self:flex-start;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const lerp=(a,b,k)=>a+(b-a)*k;
function hexMix(c1,c2,k){const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);const h=v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0');return'#'+h(lerp(a>>16,b>>16,k))+h(lerp(a>>8&255,b>>8&255,k))+h(lerp(a&255,b&255,k));}
const shade=(c,k)=>k>=0?hexMix(c,'#ffffff',k):hexMix(c,'#000000',-k);
class GameOver extends Error{constructor(r){super('gameover');this.r=r;}}

/* =============== SOUND (8-bit «Ода к радости», Бетховен) =============== */
const Sound=(()=>{
  let ac=null,master,music,sfxG,on=true,timer=null,pos=0,nextT=0,noiseBuf=null,loopN=0;
  try{on=localStorage.getItem('design-sound')!=='off';}catch(e){}

    [76,2],[76,2],[77,2],[79,2],[79,2],[77,2],[76,2],[74,2],[72,2],[72,2],[74,2],[76,2],[74,3],[72,1],[72,4],
    [74,2],[74,2],[76,2],[72,2],[74,2],[76,1],[77,1],[76,2],[72,2],[74,2],[76,1],[77,1],[76,2],[74,2],[72,2],[74,2],[67,4],
    [76,2],[76,2],[77,2],[79,2],[79,2],[77,2],[76,2],[74,2],[72,2],[72,2],[74,2],[76,2],[74,3],[72,1],[72,4]];
  const ROOTS=[36,43,36,43,36,43,43,36,43,36,43,43,36,43,43,36];
  const EV=[];{let t=0;MEL.forEach(([m,d])=>{EV.push({t,m,d,k:'lead'});t+=d;});for(let b=0;b<ROOTS.length;b++)for(let e=0;e<8;e++)EV.push({t:b*8+e,m:ROOTS[b]+(e%2?12:0),d:1,k:'bass'});for(let q=0;q<32;q++)EV.push({t:q*4+2,k:'hat'});EV.sort((a,b)=>a.t-b.t);}
  const LOOP=128;
  function init(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
    master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
    music=ac.createGain();music.gain.value=0;music.connect(master);sfxG=ac.createGain();sfxG.gain.value=1;sfxG.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}

/* =============== ELECTION / FINAL / GAME OVER =============== */
async function election(){const c=SCEN[S.scen];S.ci=c.chapters.length;head('Защита перед советом',14,.62);renderDots();
  const acc=S.total?S.correct/S.total*100:50;
  const ap=clamp(12+S.happy*.4+S.trust*.22+(S.pop/S.pop0-1)*150+(acc-50)*.16,20,84);
  await say('gromov',ap>=50?'Признаю: люди стали пользоваться приложением. Голосуйте, коллеги.':'Я против повышения. Мне так и не сделали красиво!',ap>=50?'neutral':'happy');
  await narr('Совет решает, повысить ли вас до ведущего дизайнера. Голосуют пять членов совета…');
  card(`<div class="race"><div class="cand"><div class="ava">${faceSvg(MAYORS[S.av],'neutral')}</div><div><small>За повышение · ${esc(S.name)}</small><div class="tr"><i id="rA" style="background:var(--green)"></i></div></div><b id="rAv">0%</b></div>
    <div class="cand"><div class="ava">${faceSvg(P.gromov.f,'neutral')}</div><div><small>Против · Громов</small><div class="tr"><i id="rB" style="background:var(--red)"></i></div></div><b id="rBv">0%</b></div><div class="cap" id="rD">Проголосовали: 0 из 5</div></div>`);
  let sum=0;for(let i=0;i<5;i++){await sleep(900);const sh=i===4?(S.flags[c.special]?6:-16):[3,1,-2,2,0][i];const a=clamp(ap+sh,10,90);sum+=a;const avg=sum/(i+1);
    $('#rA').style.width=avg+'%';$('#rB').style.width=(100-avg)+'%';$('#rAv').textContent=Math.round(avg)+'%';$('#rBv').textContent=Math.round(100-avg)+'%';
    $('#rD').textContent=`Проголосовали: ${i+1} из 5 · ${c.districts[i]}: ${Math.round(a)}% «за»`;Sound.sfx('tap');}
  S.final=sum/5;await sleep(700);}
function cta(){return `<div class="cta"><span class="tag">Skill Route · школа IT-профессий</span><h3>Проектируйте удобные продукты не в игре, а в реальной работе</h3><p>Исследования, сценарии, прототипы, юзабилити-тесты, доступность и дизайн-системы — база профессии продуктового дизайнера. В Skill Route её разбирают на живых кейсах с практиками, а в конце у вас портфолио и понятный путь в профессию.</p><div class="row"><a class="btn" href="https://t.me/skillroute1_bot" target="_blank" rel="noopener">Записаться на курс</a><a class="btn ghost" href="https://t.me/product_vibe_it" target="_blank" rel="noopener">Telegram-канал</a><a class="btn ghost" href="https://instagram.com/skill.route" target="_blank" rel="noopener">Instagram</a></div><p style="font-size:13.5px">Напишите боту @skillroute1_bot «Привет» — расскажем про программу и подберём поток.</p></div>`;}
function statsHtml(){const acc=S.total?Math.round(S.correct/S.total*100):0;return `<div class="statgrid"><div class="cmp"><small>Уровень</small><div><b>${LEVELS[levelOf(S.xp)].n}</b></div></div><div class="cmp"><small>Верные решения</small><div><b>${acc}%</b> · ${S.xp} XP</div></div><div class="cmp"><small>Лучшая серия</small><div><b>×${S.bestStreak}</b></div></div><div class="cmp"><small>Пользователи</small><div>${fmt(S.pop0)} → <b>${fmt(S.pop)}</b></div></div><div class="cmp"><small>Довольны</small><div><b>${Math.round(S.happy)}%</b></div></div><div class="cmp"><small>Доверие</small><div><b>${Math.round(S.trust)}</b></div></div></div>`;}
function lessonsHtml(){if(!S.lessons.length)return'';return `<h3>Что вы прокачали</h3><div class="lessons">${S.lessons.map(l=>`<div><small>${l.tag}</small><span>${l.text}</span></div>`).join('')}</div>`;}
async function finale(){const c=SCEN[S.scen];const v=S.final,win=v>=50;clearStage();$('#pSub').textContent='Итог защиты';
  const E=v>=62?['Повышение до ведущего дизайнера',`Совет поддержал вас — ${Math.round(v)}%. Теперь на каждой планёрке Громов первым делом спрашивает: «А что показал тест с пользователями?»`]
    :v>=50?['Повышение — впритык',`${Math.round(v)}% — повысили, но с оговорками. Несколько решений стоили команде денег и доверия пользователей.`]
    :v>=42?['Испытательный срок продлён',`${Math.round(v)}% — не хватило совсем немного. Совет дал ещё полгода. Вы точно знаете, где ошиблись.`]
    :['Громов нашёл другого дизайнера',`${Math.round(v)}% — совет не поддержал повышение. Новый дизайнер первым делом нарисовал градиенты и маскота. Пройдите ещё раз и проектируйте от пользователя.`];
  track('finish',{votes:clamp(Math.round(v),0,100),outcome:E[0]});
  if(win){achieve('promoted');city.fireworks(12);city.good(true);Sound.sfx('lvl');}else{city.bad();Sound.sfx('over');}
  try{const k='design-best-'+S.scen,pv=parseInt(localStorage.getItem(k)||'-1',10);if(Math.round(v)>pv)localStorage.setItem(k,String(Math.round(v)));}catch(e){}
  const f=el('div','final');
  f.innerHTML=`<div class="ending ${win?'':'lose'}"><div class="row2"><div class="ava">${faceSvg(win?MAYORS[S.av]:P.gromov.f,'happy')}</div><div><span class="tag ${win?'':'r'}">Концовка · ${c.city}</span><h2 style="margin-top:6px">${E[0]}</h2></div></div><p>${E[1]}</p></div>
    ${statsHtml()}<h3>Достижения: ${S.ach.length}</h3><div class="badges">${S.ach.map(id=>`<div class="badge">${badgeSvg(id)}<div><b>${ACH[id][0]}</b><small>${ACH[id][1]}</small></div></div>`).join('')||'<p class="cap">Пока ни одного — в следующий раз получится.</p>'}</div>${lessonsHtml()}${cta()}`;
  const r=el('div','row');const again=el('button','btn big','Другой кейс');again.onclick=()=>boot();const same=el('button','btn ghost big','Этот кейс заново');same.onclick=()=>startScenario(S.scen,S.name,S.av);r.append(again,same);f.appendChild(r);add(f);stage.scrollTop=0;}
async function gameOverScreen(r){city.bad();city.flash();Sound.sfx('over');clearStage();$('#pSub').textContent='Гейм-овер';
  const g=el('div','gover');g.innerHTML=`<span class="tag r">Срок окончен досрочно</span><div class="big">Гейм-овер</div><h2>${r.title}</h2><p style="color:#d5dce6">${r.why}</p>${r.lesson?`<div class="lesson"><span>Урок дизайнера</span><p>${r.lesson}</p></div>`:''}${statsHtml()}`;add(g);
  return new Promise(res=>{const row=el('div','row');const a=el('button','btn big','Переиграть главу');a.onclick=()=>res('retry');const b=el('button','btn ghost big','Другой кейс');b.onclick=()=>res('menu');row.append(a,b);add(row);add(el('div','',cta()));});}

function scenIcon(id){const c={A:['#e6a26e','#3a4a6a','#ffd27a'],B:['#8a9aa6','#3a4a3a','#c9b47a'],C:['#6aa8ff','#22324a','#9fe0ff']}[id];

  ${[[4,30,8],[13,24,9],[23,32,7],[31,20,10],[42,28,9]].map(b=>`<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${40-b[1]}" fill="rgba(15,20,32,.75)"/>`).join('')}<rect y="40" width="54" height="14" fill="rgba(10,20,36,.8)"/><rect y="40" width="54" height="1.5" fill="${c[2]}" opacity=".7"/></svg>`;}
async function boot(){S=null;renderHud();renderDots();city.setup({seed:11,land:'none'});city.sky(.74,{});clearStage();

  $('#lvlTxt').textContent='Стажёр · 0 XP';$('#lvlBar').style.width='0%';$('#streak').dataset.n=0;$('#streakTxt').textContent='×0';
  let av=0,sc=null;
  const box=el('div','intro');
  box.innerHTML=`<span class="tag">Skill Route · квест для продуктовых дизайнеров</span><h1>Город в <span>приложении</span></h1>
    <p class="lede">Вас взяли продуктовым дизайнером в команду приложения «Мой Светлоград»: билеты, запись к врачу, оплата ЖКХ. Исследуйте, проектируйте, тестируйте и спорьте с вице-мэром и маркетингом. Сделаете интерфейс, который обманывает людей, или потеряете пользователей — игра окончена.</p>
    <div class="field"><label for="nm">Как вас зовут?</label><div class="inrow"><input id="nm" maxlength="16" autocomplete="given-name" placeholder="Введите имя" enterkeyhint="next"></div><div class="err" id="nmErr"></div></div>
    <div class="field"><label for="ct">Email или ник в Telegram</label><div class="inrow"><input id="ct" maxlength="80" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="anna@mail.ru или @anna_design" enterkeyhint="done"></div><div class="err" id="ctErr"></div><div class="cap">Пришлём ваш результат и разбор ошибок. Нажимая «Выйти на работу», вы соглашаетесь, что Skill Route может написать вам по этому контакту.</div></div>
    <div class="field"><label>Ваш портрет</label><div class="avatars" id="avs"></div></div>

  stage.appendChild(box);
  const avs=box.querySelector('#avs');MAYORS.forEach((m,i)=>{const b=el('button','avbtn',faceSvg(m,'happy'));b.setAttribute('aria-pressed',i===0?'true':'false');b.setAttribute('aria-label','Портрет '+(i+1));b.onclick=()=>{av=i;Sound.sfx('tap');[...avs.children].forEach((c,k)=>c.setAttribute('aria-pressed',k===i?'true':'false'));};avs.appendChild(b);});

  const upd=()=>{go.disabled=!(inp.value.trim()&&ct.value.trim()&&sc);};upd();
  inp.addEventListener('input',()=>{err.textContent='';upd();});ct.addEventListener('input',()=>{cerr.textContent='';upd();});
  const check=()=>{if(!inp.value.trim()){err.textContent='Введите имя, чтобы продолжить';inp.focus();return false;}
    if(!parseContact(ct.value)){cerr.textContent='Введите email (anna@mail.ru) или ник в Telegram (@anna_pm, от 5 символов)';ct.focus();return false;}
    if(!sc){cerr.textContent='Теперь выберите кейс ниже';scs.scrollIntoView({behavior:'smooth',block:'nearest'});return false;}return true;};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!inp.value.trim()){err.textContent='Введите имя, чтобы продолжить';return;}ct.focus();}});

  if(!isMobile())setTimeout(()=>(inp.value?ct:inp).focus(),300);
  await new Promise(r=>go.onclick=()=>{if(check())r();});
  const pc=parseContact(ct.value);PLAYER={name:inp.value.trim(),c:pc.c,t:pc.t};

function parseContact(v){v=(v||'').trim();if(!v)return null;
  if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return{c:v.toLowerCase(),t:'email'};

  return m?{c:'@'+m[1],t:'telegram'}:null;}

const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhocXJkeXJpYW9jaGtpc2Vnc2VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3ODI1ODMsImV4cCI6MjA5MDM1ODU4M30.SrTyAkWRMWdjecs2JcjooUxfBuWLgc2QyA5bMWtT8Iw';

let runId=0;

boot();
