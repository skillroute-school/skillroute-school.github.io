<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Город в приложении — квест Skill Route</title>
<meta name="description" content="Квест для будущих продуктовых дизайнеров: исследования, прототипы, юзабилити-тесты и доступность. Узнайте, кто такой продуктовый дизайнер.">
<meta property="og:title" content="Город в приложении — квест Skill Route">
<meta property="og:description" content="Вы — продуктовый дизайнер городского приложения. Три кейса, споры с маркетингом и гейм-овер за тёмные паттерны.">
<meta name="theme-color" content="#16161a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236d4aff'/%3E%3Crect x='20' y='10' width='24' height='44' rx='6' fill='none' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ink:#16161a;--bg:#ebebe7;--paper:#fff;--muted:#6b6b76;--dim:#9a9aa4;--lc:#e3e3e8;
  --sun:#ffe46b;--sun-s:#fff8d8;--pink:#ff7262;--pink-s:#ffebe7;--green:#14ae5c;--green-s:#e2f6ea;
  --red:#f24822;--red-s:#fde9e3;--blue:#0c8ce9;--blue-s:#e6f3fd;--violet:#6d4aff;--violet-d:#5734ef;--violet-s:#f0ecff;
  --fd:'Unbounded',system-ui,sans-serif;--f:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --line:1px solid var(--lc);--sh:0 1px 2px rgba(16,16,26,.06),0 14px 34px -16px rgba(16,16,26,.22);--sh2:0 1px 2px rgba(16,16,26,.07);
  --panelW:clamp(400px,40vw,580px);--cityH:100vh;color-scheme:light;
}
@supports(height:100dvh){:root{--cityH:100dvh}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.55;font-weight:500}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{max-width:100%}
#city{position:fixed;left:0;top:0;width:100vw;height:var(--cityH);display:block;z-index:0}

.hud{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:calc(var(--panelW) + 34px);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:700;font-size:13.5px;letter-spacing:-.01em;margin-right:2px;background:var(--ink);color:#fff;border-radius:9px;height:34px;padding:0 13px 0 6px}
.brand .logo{width:24px;height:24px;border-radius:6px;background:var(--violet);display:grid;place-items:center}
.brand .logo svg{width:14px;height:14px}.brand .logo svg *{stroke:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px 0 8px;border-radius:9px;background:rgba(255,255,255,.94);border:var(--line);box-shadow:var(--sh2);font-family:var(--fm);font-weight:700;font-size:13px;white-space:nowrap;position:relative;backdrop-filter:blur(6px)}
.chip svg{width:16px;height:16px;flex:0 0 16px}
.chip small{font-family:var(--f);font-weight:600;color:var(--muted);font-size:11px}
.chip b{font-variant-numeric:tabular-nums}
.chip.up{background:var(--green-s);border-color:#b6e6c9}.chip.down{background:var(--red-s);border-color:#f7c3b5}
.chip.warn{border-color:var(--red);box-shadow:0 0 0 3px var(--red-s);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,72,34,.08)}}
.sound{cursor:pointer;padding:0 12px;font-family:var(--f);font-weight:700}
.sound[aria-pressed="false"]{color:var(--dim);background:#f4f4f6}
.fl{position:absolute;right:4px;top:-17px;font-family:var(--fm);font-weight:700;font-size:12px;pointer-events:none;animation:fl 1.5s ease-out forwards;padding:1px 6px;border-radius:5px;background:var(--ink);color:#fff}
.fl.p{background:var(--green)}.fl.n{background:var(--red)}
@keyframes fl{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:translateY(-3px)}100%{opacity:0;transform:translateY(-16px)}}
.sr{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 5px;border-radius:9px;background:rgba(255,255,255,.94);border:var(--line);color:var(--ink);text-decoration:none;font-family:var(--f);font-weight:800;font-size:12.5px}
.sr i{width:24px;height:24px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:9.5px;font-family:var(--fm)}

.cityInfo{position:fixed;z-index:4;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;background:rgba(255,255,255,.95);border:var(--line);border-radius:12px;box-shadow:var(--sh);padding:10px 14px 11px;backdrop-filter:blur(6px)}
.cityInfo .nm{font-family:var(--fd);font-weight:700;font-size:clamp(16px,1.6vw,21px);letter-spacing:-.01em;line-height:1.1}
.cityInfo .sub{font-family:var(--fm);font-weight:500;color:var(--muted);font-size:11.5px;margin-top:4px}
.dots{display:flex;gap:4px;margin-top:8px}
.dots span{width:18px;height:5px;border-radius:3px;background:#dedee4;transition:background .3s}
.dots span.done{background:var(--violet)}.dots span.now{background:var(--blue)}

.panel{position:fixed;z-index:6;top:calc(36px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(18px,env(safe-area-inset-right,0px));width:var(--panelW);background:#fff;border-radius:6px;display:flex;flex-direction:column;box-shadow:0 0 0 1.5px var(--blue),0 30px 60px -30px rgba(16,16,26,.35)}
.panel .hdl{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--blue);z-index:3;pointer-events:none}
.hdl.a{left:-5px;top:-5px}.hdl.b{right:-5px;top:-5px}.hdl.c{left:-5px;bottom:-5px}.hdl.d{right:-5px;bottom:-5px}
.frameLbl{position:absolute;left:0;top:-22px;font-family:var(--fm);font-size:11.5px;font-weight:500;color:var(--blue);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.frameSize{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-family:var(--fm);font-size:10.5px;font-weight:700;color:#fff;background:var(--blue);border-radius:4px;padding:1px 6px;white-space:nowrap}
.phead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ink);color:#fff;min-height:56px;border-radius:6px 6px 0 0}
.phead .ttl{flex:1;min-width:0}
.phead .ttl b{display:block;font-family:var(--fd);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .ttl small{display:block;font-family:var(--fm);font-weight:500;font-size:11.5px;color:#a9a9b4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;flex-direction:column;gap:5px;min-width:122px;background:#26262c;border-radius:7px;padding:5px 9px}
.lvl b{font-family:var(--fm);font-size:11px;font-weight:700;line-height:1.1;white-space:nowrap}
.lvlbar{height:4px;border-radius:2px;background:#3a3a42;overflow:hidden}
.lvlbar i{display:block;height:100%;width:0;background:var(--violet);transition:width .7s}
.streak{display:flex;align-items:center;gap:3px;font-family:var(--fm);font-weight:700;font-size:12px;padding:5px 9px;border-radius:7px;background:#26262c}
.streak[data-n="0"]{opacity:.45}
.streak svg{width:15px;height:15px}
#stage{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:22px 22px 44px;display:flex;flex-direction:column;gap:16px;position:relative;background:#fff;border-radius:0 0 6px 6px}
#stage::-webkit-scrollbar{width:9px}#stage::-webkit-scrollbar-thumb{background:#cfcfd6;border-radius:5px;border:2px solid #fff}
#stage>*{flex-shrink:0;animation:pop .32s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:899px){
  :root{--cityH:36vh}
  @supports(height:100dvh){:root{--cityH:36dvh}}
  .hud{left:8px;right:8px;top:calc(7px + env(safe-area-inset-top,0px));gap:4px}
  .brand,.sr{display:none}
  .chip{height:28px;padding:0 7px 0 5px;font-size:11.5px;gap:4px}
  .chip small{display:none}.chip svg{width:14px;height:14px;flex-basis:14px}
  .sound{padding:0 8px}
  .fl{top:auto;bottom:-19px}
  .panel{top:calc(var(--cityH) - 12px);left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px -12px rgba(16,16,26,.3)}
  .panel .hdl,.frameLbl,.frameSize{display:none}
  .phead{padding:8px 12px;min-height:50px;border-radius:14px 14px 0 0}
  .lvl{min-width:92px}
  #stage{padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px));border-radius:0}
  .cityInfo{bottom:auto;top:calc(var(--cityH) - 70px);left:8px;padding:6px 10px}
  .cityInfo .nm{font-size:14px}.cityInfo .sub{font-size:10.5px;margin-top:1px}.dots{display:none}
}

h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--fd);font-size:clamp(32px,3.7vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
h1 span{position:relative;color:var(--violet);display:inline-block;outline:1.5px solid var(--blue);outline-offset:3px;margin:2px 4px 0 0}
h1 span::before,h1 span::after{content:"";position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--blue);top:-8px;left:-8px}
h1 span::after{top:auto;left:auto;bottom:-8px;right:-8px}
h2{font-family:var(--fd);font-size:clamp(20px,2vw,26px);font-weight:700;letter-spacing:-.02em}
h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
h4{font-weight:800}
p{margin:0}
.chHead{display:flex;flex-direction:column;gap:9px;padding-bottom:4px;border-bottom:var(--line)}
.chHead h2{padding-bottom:10px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:5px;background:var(--violet-s);color:var(--violet);font-family:var(--fm);font-weight:700;font-size:11px;letter-spacing:.02em;text-transform:uppercase}
.tag.g{background:#f2f2f4;color:var(--muted)}
.tag.r{background:var(--red-s);color:var(--red)}

.line{display:flex;gap:10px;align-items:flex-start}
.ava{flex:0 0 40px;width:40px;height:40px;border-radius:50%;overflow:hidden;background:#f4f4f6}
.ava svg{display:block;width:100%;height:100%}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:var(--line);border-radius:4px 14px 14px 14px;padding:9px 14px 11px;box-shadow:var(--sh2)}
.who{font-size:13.5px;font-weight:800;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin-bottom:1px}
.who em{font-style:normal;color:var(--muted);font-weight:500;font-size:12.5px}
.txt{font-size:16px;line-height:1.55;font-weight:500}
.txt.typing::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--violet);margin-left:2px;vertical-align:-2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.narr{background:var(--sun);border-radius:3px;padding:14px 16px 15px;box-shadow:0 10px 18px -12px rgba(80,60,0,.45);transform:rotate(-.5deg);position:relative}
.narr::before{content:"заметка";position:absolute;top:-9px;right:14px;font-family:var(--fm);font-size:10px;font-weight:700;text-transform:uppercase;background:var(--ink);color:var(--sun);padding:1px 6px;border-radius:3px}
.narr .txt{font-weight:600}
.hintBox{background:var(--blue-s);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 14px;font-weight:500}
.hintBox b{color:var(--blue)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:var(--line);border-radius:10px;padding:12px 14px;font-weight:600;font-size:15.5px;line-height:1.45;transition:border-color .12s,background .12s,box-shadow .12s}
.choice:hover:not(:disabled){border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-s)}
.choice:disabled{cursor:default;opacity:.5}
.key{flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--fm);font-size:12px;font-weight:700;background:#f2f2f4;color:var(--muted);margin-top:1px}
.choice:hover:not(:disabled) .key{background:var(--violet);color:#fff}
.choice.picked{opacity:1}
.choice.ok{background:var(--green-s);border-color:var(--green)}.choice.ok .key{background:var(--green);color:#fff}
.choice.bad{background:var(--red-s);border-color:var(--red)}.choice.bad .key{background:var(--red);color:#fff}
.choice.mid{background:var(--sun-s);border-color:#e8c93a}
.choice.right{opacity:1;border:1.5px dashed var(--green);background:#f3fbf6}

.btn{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:8px;border:0;background:var(--violet);color:#fff;font-family:var(--f);font-weight:800;font-size:15px;text-decoration:none;transition:background .12s,transform .08s}
.btn:hover:not(:disabled){background:var(--violet-d)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #d6d6dc;font-size:14px}
.btn.ghost:hover:not(:disabled){background:#f6f6f8}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}
.btn.big{min-height:50px;font-size:16.5px;padding:0 24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fb{border:var(--line);border-radius:12px;padding:16px;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--dim)}
.fb.ok{border-top-color:var(--green)}.fb.bad{border-top-color:var(--red)}.fb.mid{border-top-color:#e8c93a}
.fbTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict{font-family:var(--fm);font-weight:700;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.fb.ok .verdict{background:var(--green-s);color:#0d8a47}.fb.bad .verdict{background:var(--red-s);color:var(--red)}.fb.mid .verdict{background:var(--sun-s);color:#8a6d00}
.xp{font-family:var(--fm);font-weight:700;font-size:12.5px;color:var(--violet)}
.fb p{font-size:15.5px}
.lesson{background:var(--violet-s);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;padding:11px 14px 12px;margin-top:2px}
.lesson span{display:block;font-family:var(--fm);font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--violet);margin-bottom:3px}
.lesson p{font-weight:600;font-size:15px}

.card{border:var(--line);border-radius:12px;padding:15px;background:#fff;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph small,.cap{font-size:12.5px;font-weight:500;color:var(--muted)}
.ph small{font-family:var(--fm)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 46px;gap:10px;align-items:center;font-weight:600;font-size:14px}
.track{height:12px;border-radius:6px;background:#f0f0f3;overflow:hidden}
.fill{height:100%;width:0;background:var(--violet);border-radius:6px;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.bar.hot .fill{background:var(--pink)}
.v{font-family:var(--fm);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

.funnel{display:flex;flex-direction:column;gap:2px}
.fstep{display:flex;flex-direction:column;gap:6px;background:none;border:1px solid transparent;padding:7px 8px;border-radius:8px;text-align:left;width:100%}
.fstep:hover:not(:disabled){background:var(--violet-s);border-color:#d9d0ff}
.fstep:disabled{cursor:default}
.flabel{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14.5px}
.flabel em{font-style:normal;font-family:var(--fm);font-weight:700;font-variant-numeric:tabular-nums}
.ftrack{height:16px}
.fbar{display:block;height:100%;width:0;border-radius:4px;background:var(--violet);transition:width .9s cubic-bezier(.2,.9,.3,1)}
.drop{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--muted);padding-left:9px;height:0;overflow:hidden;transition:height .3s}
.funnel.revealed .drop{height:19px}.drop.big{color:var(--red);font-weight:700}
.fstep.ok{background:var(--green-s)}.fstep.ok .fbar{background:var(--green)}
.fstep.bad{background:var(--red-s)}.fstep.bad .fbar{background:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.ch{border:1px solid #d6d6dc;background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;text-align:left;transition:all .12s}
.ch:hover:not(:disabled){border-color:var(--violet)}
.ch[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.ch.yes{background:var(--pink-s);border-color:#f8bfb4}.ch.no{background:var(--green-s);border-color:#a9dfc0}
.ch.miss{outline:2px dashed var(--red);outline-offset:2px}
.ch:disabled{cursor:default}

.residents{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 6px 12px;border:var(--line);border-radius:12px;background:#fff}
.res .ava{width:52px;height:52px;flex:none}
.res b{font-size:14px;font-weight:800}.res small{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.3}
.qlist{display:flex;flex-direction:column;gap:6px}
.q{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:var(--line);border-radius:9px;padding:9px 12px;font-weight:600;font-size:15px}
.q:hover:not(:disabled){border-color:var(--violet)}
.q[aria-pressed="true"]{background:var(--violet-s);border-color:var(--violet)}
.q .box{flex:0 0 20px;height:20px;border-radius:5px;border:1.5px solid #c9c9d1;display:grid;place-items:center;font-family:var(--fm);font-size:11px;font-weight:700;background:#fff;color:var(--muted)}
.q[aria-pressed="true"] .box{background:var(--violet);border-color:var(--violet);color:#fff}
.q:disabled{cursor:default}.q.g{background:var(--green-s);border-color:#a9dfc0}.q.b{background:var(--red-s);border-color:#f8bfb4}
.qa{border:var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:9px}
.qa h4{font-size:15px}
.ans{display:flex;gap:9px;align-items:flex-start;font-size:15px}
.ans .mini{flex:0 0 28px;width:28px;height:28px;border-radius:50%;overflow:hidden}
.ans .mini svg{width:100%;height:100%;display:block}
.qv{align-self:flex-start;font-family:var(--fm);font-weight:700;font-size:11px;padding:2px 7px;border-radius:4px}
.qv.g{background:var(--green-s);color:#0d8a47}.qv.b{background:var(--red-s);color:var(--red)}.qv.m{background:var(--sun-s);color:#8a6d00}

.slots{display:flex;flex-direction:column;gap:12px}
.slot{display:flex;flex-direction:column;gap:7px}
.slot>b{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.slot .ch{font-size:13.5px;padding:6px 12px}
.preview{font-size:16.5px;font-weight:600;line-height:1.6;background:#fafafb;border:1px dashed #cfcfd6;border-radius:10px;padding:12px 14px}

  if(a>b)setTimeout(()=>{Sound.sfx('lvl');city.good(true);toast(`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#ffb547"/><path d="M20 10l8 9h-5v10h-6V19h-5z" fill="#1c1204"/></svg><div><b>Новый уровень: ${LEVELS[a].n}</b><small>Вы растёте как дизайнер</small></div>`,'lv',3400);},450);}
function score(kind,pts){S.total++;let g=0;
  if(kind==='ok'){S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);g=pts+(S.streak>=3?4:0);if(S.streak===5)achieve('streak5');Sound.sfx('ok');}
  else if(kind==='mid'){S.streak=0;g=Math.round(pts/2);S.correct+=.5;Sound.sfx('tap');}
  else{S.streak=0;Sound.sfx('bad');}
  addXP(g);return g;}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function reveal(n){requestAnimationFrame(()=>{const top=n.offsetTop,bot=top+n.offsetHeight,vt=stage.scrollTop,vh=stage.clientHeight;
  let target=null;if(bot>vt+vh-8)target=Math.min(top-12,bot-vh+20);else if(top<vt)target=top-12;
  if(target!=null)stage.scrollTo({top:Math.max(0,target),behavior:reduce?'auto':'smooth'});});}
function follow(){const gap=stage.scrollHeight-stage.scrollTop-stage.clientHeight;if(gap>0&&gap<160)stage.scrollTop=stage.scrollHeight;}
function clearStage(){stage.innerHTML='';stage.scrollTop=0;}
function add(n){stage.appendChild(n);reveal(n);return n;}
function card(html){return add(el('div','card',html));}
let skipNow=false,typing=0;
stage.addEventListener('click',e=>{if(typing&&!e.target.closest('button,a,input'))skipNow=true;});
function type(node,text){return new Promise(res=>{
  if(reduce){node.textContent=text;res();return;}
  let i=0;typing++;node.classList.add('typing');
  const done=()=>{node.textContent=text;node.classList.remove('typing');typing=Math.max(0,typing-1);skipNow=false;follow();res();};
  const step=()=>{if(skipNow)return done();i+=3;node.textContent=text.slice(0,i);follow();if(i>=text.length)return done();setTimeout(step,16);};step();});}

/* line/bar chart svg (light) */
function chartSvg({labels,series,yMax,yStep,unit='',type='line',hl=[],w=560,h=230,goal}){
  const L=40,R=12,T=14,B=28,x=i=>L+(type==='bar'?(i+.5)*(w-L-R)/labels.length:i*(w-L-R)/(labels.length-1)),y=v=>T+(1-v/yMax)*(h-T-B);
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;min-width:340px;display:block" role="img">`;
  for(let v=0;v<=yMax;v+=yStep)s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="#ececf0"/><text x="${L-8}" y="${y(v)+4}" fill="#56536e" font-size="12" font-weight="600" font-family="Manrope" text-anchor="end">${v}${unit}</text>`;
  const step=Math.ceil(labels.length/12);labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${x(i)}" y="${h-8}" fill="#56536e" font-size="12" font-weight="700" font-family="Manrope" text-anchor="middle">${l}</text>`;});
  if(goal!=null)s+=`<line x1="${L}" x2="${w-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#22b87a" stroke-dasharray="6 5" stroke-width="2.5"/><text x="${w-R}" y="${y(goal)-6}" fill="#168a5a" font-size="12" font-weight="800" font-family="Manrope" text-anchor="end">норма ${goal}${unit}</text>`;
  series.forEach(se=>{if(type==='bar'){const bw=(w-L-R)/labels.length*.62;se.v.forEach((v,i)=>{s+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="4" fill="${hl.includes(i)?se.hc||'#ff7262':se.c}"/>`;});}
    else{const d=se.v.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('');s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+se.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${se.c}" stroke-width="2"/>`).join('');}});
  return s+'</svg>';}
