<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Мэр на данных — квест Skill Route</title>
<meta name="description" content="Квест для будущих продактов: три города, три кризиса и 24 месяца, чтобы принимать решения на основе данных.">
<meta property="og:title" content="Мэр на данных — квест Skill Route">
<meta property="og:description" content="Три города, три кризиса, 24 месяца. Решайте как продакт-менеджер — или проиграете выборы.">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f17'/%3E%3Cpath d='M10 50V30h8v20M22 50V18h10v32M36 50V26h8v24M48 50V34h6v16' fill='%23ffb547'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#0b0f17;--glass:rgba(13,18,29,.88);--glass2:rgba(255,255,255,.045);--glass3:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
  --fg:#eef2f7;--muted:#9eabbd;--dim:#6f7c90;
  --amber:#ffb547;--amber-s:rgba(255,181,71,.14);--green:#5ad19a;--green-s:rgba(90,209,154,.14);
  --red:#ff6b6b;--red-s:rgba(255,107,107,.14);--blue:#6aa8ff;--blue-s:rgba(106,168,255,.14);--violet:#a68bff;
  --f:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --panelW:clamp(400px,40vw,590px);--cityH:100vh;
  color-scheme:dark;
}
@supports(height:100dvh){:root{--cityH:100dvh}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.55;font-weight:450}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg{max-width:100%}

#city{position:fixed;left:0;top:0;width:100vw;height:var(--cityH);display:block;z-index:0}

/* HUD */
.hud{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));right:calc(var(--panelW) + 34px);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;margin-right:6px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--amber);display:grid;place-items:center}
.brand .logo svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:rgba(10,14,22,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);font-weight:700;font-size:13.5px;white-space:nowrap;position:relative}
.chip svg{width:16px;height:16px;flex:0 0 16px}
.chip small{font-weight:600;color:var(--muted);font-size:11.5px}
.chip b{font-variant-numeric:tabular-nums}
.chip.up{border-color:rgba(90,209,154,.6)}.chip.down{border-color:rgba(255,107,107,.6)}
.chip.warn{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.5)}
.sound{cursor:pointer}
.sound[aria-pressed="false"]{color:var(--dim)}
.fl{position:absolute;right:6px;top:-18px;font-weight:800;font-size:12.5px;pointer-events:none;animation:fl 1.5s ease-out forwards;padding:1px 6px;border-radius:6px;background:rgba(10,14,22,.85)}
.fl.p{color:var(--green)}.fl.n{color:var(--red)}
@keyframes fl{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}
.sr{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 4px;border-radius:999px;background:rgba(10,14,22,.62);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.sr i{width:22px;height:22px;border-radius:50%;background:var(--green);color:#06221a;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:9px}

.cityInfo{position:fixed;z-index:4;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.cityInfo .nm{font-weight:900;font-size:clamp(30px,3.6vw,52px);letter-spacing:-.025em;line-height:1}
.cityInfo .sub{font-weight:600;color:rgba(238,242,247,.82);font-size:14px;margin-top:6px}
.dots{display:flex;gap:5px;margin-top:10px}
.dots span{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);transition:background .4s}
.dots span.done{background:var(--green)}.dots span.now{background:var(--amber)}

/* PANEL */
.panel{position:fixed;z-index:6;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(14px,env(safe-area-inset-right,0px));width:var(--panelW);background:var(--glass);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.phead{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);min-height:58px}
.phead .ttl{flex:1;min-width:0}
.phead .ttl b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .ttl small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;flex-direction:column;gap:4px;min-width:118px}
.lvl b{font-size:12px;font-weight:800;line-height:1.1;white-space:nowrap}
.lvlbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.lvlbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--amber));transition:width .7s}
.streak{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:5px 9px;border-radius:999px;background:var(--glass2);border:1px solid var(--line)}
.streak[data-n="0"]{opacity:.45}
.streak svg{width:15px;height:15px}
#stage{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px;position:relative}
#stage::-webkit-scrollbar{width:8px}#stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
#stage>*{flex-shrink:0;animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:899px){
  :root{--cityH:36vh}
  @supports(height:100dvh){:root{--cityH:36dvh}}
  .hud{left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));gap:5px}
  .brand{display:none}
  .chip{height:30px;padding:0 9px;font-size:12.5px;gap:5px}
  .chip small{display:none}
  .chip svg{width:14px;height:14px;flex-basis:14px}
  .sr{display:none}
  .panel{top:calc(var(--cityH) - 16px);left:0;right:0;bottom:0;width:auto;border-radius:20px 20px 0 0;border-bottom:0;border-left:0;border-right:0}
  .phead{padding:10px 14px;min-height:52px}
  .lvl{min-width:92px}
  #stage{padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px))}
  .cityInfo{bottom:auto;top:calc(var(--cityH) - 66px);left:12px}
  .cityInfo .nm{font-size:22px}.cityInfo .sub{font-size:12px;margin-top:2px}.dots{display:none}
}

/* CONTENT */
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(32px,4vw,46px);font-weight:900}
h2{font-size:clamp(22px,2.2vw,28px);font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0}
.chHead{display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;background:var(--amber-s);color:var(--amber);font-weight:800;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.tag.g{background:var(--glass3);color:var(--muted)}
.tag.r{background:var(--red-s);color:var(--red)}

.line{display:flex;gap:11px;align-items:flex-start}
.ava{flex:0 0 50px;width:50px;height:50px;border-radius:50%;overflow:hidden;background:#222;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.ava svg{display:block;width:100%;height:100%}
.bubble{flex:1;min-width:0;background:var(--glass2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px 12px}
.who{font-size:13px;font-weight:800;color:var(--amber);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin-bottom:2px}
.who em{font-style:normal;color:var(--dim);font-weight:600;font-size:12px}
.txt{font-size:16px;line-height:1.55;font-weight:450}
.txt.typing::after{content:"";display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--amber);animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.narr{border-left:3px solid var(--amber);background:linear-gradient(90deg,var(--amber-s),transparent 80%);padding:10px 14px;border-radius:0 12px 12px 0}
.narr .txt{font-weight:600;color:#f6e7cf}
.hintBox{border:1px dashed rgba(106,168,255,.5);background:var(--blue-s);border-radius:12px;padding:10px 14px;font-size:15px}
.hintBox b{color:var(--blue)}

.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:550;font-size:15.5px;line-height:1.45;transition:border-color .15s,background .15s,transform .15s}
.choice:hover:not(:disabled){border-color:var(--amber);background:var(--amber-s)}
.choice:active:not(:disabled){transform:scale(.99)}
.choice:disabled{cursor:default;opacity:.42}
.key{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--glass3);color:var(--amber);margin-top:-1px}
.choice.picked{opacity:1}
.choice.ok{border-color:var(--green);background:var(--green-s)}.choice.ok .key{background:var(--green);color:#06221a}
.choice.bad{border-color:var(--red);background:var(--red-s)}.choice.bad .key{background:var(--red);color:#2a0606}
.choice.mid{border-color:var(--amber);background:var(--amber-s)}.choice.mid .key{background:var(--amber);color:#2a1a02}
.choice.right{opacity:.9;border-style:dashed;border-color:var(--green)}

.btn{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--amber);color:#1c1204;font-weight:800;font-size:15px;text-decoration:none;transition:transform .12s,filter .15s,opacity .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--glass3);color:var(--fg);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#2a0606}
.btn.green{background:var(--green);color:#06221a}
.btn.big{min-height:52px;font-size:17px;padding:0 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.fb{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--glass2);display:flex;flex-direction:column;gap:10px}
.fb.ok{border-color:rgba(90,209,154,.45)}.fb.bad{border-color:rgba(255,107,107,.45)}.fb.mid{border-color:rgba(255,181,71,.45)}
.fbTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict{font-weight:900;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:6px}
.fb.ok .verdict{background:var(--green);color:#06221a}.fb.bad .verdict{background:var(--red);color:#2a0606}.fb.mid .verdict{background:var(--amber);color:#2a1a02}
.xp{font-weight:800;font-size:13px;color:var(--green)}
.fb p{color:#d5dce6;font-size:15.5px}
.lesson{border-left:3px solid var(--amber);background:var(--amber-s);border-radius:0 10px 10px 0;padding:10px 12px}
.lesson span{display:block;font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.lesson p{color:var(--fg);font-weight:550;font-size:15px}

.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--glass2);display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph small,.cap{font-size:13px;font-weight:550;color:var(--muted)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-weight:600;font-size:14.5px}
.track{height:12px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.fill{height:100%;width:0;border-radius:6px;background:#7f8ea3;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.hot .fill{background:var(--amber)}
.v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}

.funnel{display:flex;flex-direction:column;gap:2px}
.fstep{display:flex;flex-direction:column;gap:5px;background:none;border:1px solid transparent;padding:8px 10px;border-radius:12px;text-align:left;width:100%}
.fstep:hover:not(:disabled){background:var(--amber-s);border-color:rgba(255,181,71,.35)}
.fstep:disabled{cursor:default}
.flabel{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14.5px}
.flabel em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.ftrack{height:14px;border-radius:7px;background:rgba(255,255,255,.06);overflow:hidden}
.fbar{display:block;height:100%;width:0;border-radius:7px;background:var(--blue);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.drop{font-size:13px;font-weight:700;color:var(--dim);padding-left:12px;height:0;overflow:hidden;transition:height .3s}
.funnel.revealed .drop{height:19px}.drop.big{color:var(--red)}
.fstep.ok{background:var(--green-s);border-color:rgba(90,209,154,.5)}.fstep.ok .fbar{background:var(--green)}
.fstep.bad{background:var(--red-s);border-color:rgba(255,107,107,.5)}.fstep.bad .fbar{background:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;text-align:left;transition:background .15s,border-color .15s}
.ch:hover:not(:disabled){border-color:var(--line2)}
.ch[aria-pressed="true"]{background:var(--amber-s);border-color:var(--amber);color:#ffe0ad}
.ch.yes{background:var(--red-s);border-color:rgba(255,107,107,.5)}.ch.no{background:var(--green-s);border-color:rgba(90,209,154,.5)}
.ch.miss{outline:2px dashed var(--amber);outline-offset:2px}
.ch:disabled{cursor:default}

.residents{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:14px;background:var(--glass2)}
.res .ava{width:58px;height:58px;flex:none}
.res b{font-size:13.5px}.res small{font-size:11.5px;color:var(--muted);line-height:1.3}
.qlist{display:flex;flex-direction:column;gap:7px}
.q{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:550;font-size:15px}
.q[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-s)}
.q .box{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:900;margin-top:1px}
.q[aria-pressed="true"] .box{background:var(--amber);border-color:var(--amber);color:#2a1a02}
.q:disabled{cursor:default}.q.g{border-color:rgba(90,209,154,.5)}.q.b{border-color:rgba(255,107,107,.5)}
.qa{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--glass2);display:flex;flex-direction:column;gap:9px}
.qa h4{font-size:14.5px;font-weight:700;color:#dfe5ee}
.ans{display:flex;gap:9px;align-items:flex-start;font-size:15px}
.ans .mini{flex:0 0 30px;width:30px;height:30px;border-radius:50%;overflow:hidden}
.ans .mini svg{width:100%;height:100%;display:block}
.qv{align-self:flex-start;font-weight:800;font-size:11.5px;padding:2px 8px;border-radius:5px;letter-spacing:.03em}
.qv.g{background:var(--green-s);color:var(--green)}.qv.b{background:var(--red-s);color:var(--red)}.qv.m{background:var(--amber-s);color:var(--amber)}

.slots{display:flex;flex-direction:column;gap:12px}
.slot{display:flex;flex-direction:column;gap:7px}
.slot>b{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot .ch{font-size:14px;padding:7px 12px}
.preview{font-size:16.5px;font-weight:600;line-height:1.6;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.preview span{color:var(--amber);border-bottom:1.5px solid var(--amber)}
.preview span.empty{color:var(--dim);border-bottom-style:dashed;border-color:var(--dim)}

.abc{width:100%;height:220px;display:block}
.abmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.abmeta b{color:var(--fg)}
.lg{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.peek{display:flex;flex-direction:column;gap:10px;background:var(--red-s);border:1px solid rgba(255,107,107,.4);border-radius:14px;padding:12px 14px}
.peek b{font-weight:800}

table.dt{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:340px}
.dt th,.dt td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt th{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.dt td b{font-weight:800}
.dt tr.tot td{font-weight:800;border-top:1px solid var(--line2)}
.up{color:var(--green)}.dn{color:var(--red)}
.heat td.c{text-align:center;font-weight:700;border-radius:6px}

.toggle{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.2)}
.toggle button{border:0;background:none;padding:7px 14px;font-weight:700;font-size:13.5px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--amber);color:#2a1a02}

.paper{background:#f3eee2;color:#211c14;border-radius:6px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-.6deg);animation:paperIn .6s cubic-bezier(.2,.9,.3,1.1) both!important}
@keyframes paperIn{from{opacity:0;transform:rotate(-8deg) scale(.85) translateY(20px)}to{opacity:1;transform:rotate(-.6deg)}}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:3px double #211c14;padding-bottom:6px;flex-wrap:wrap}
.mast b{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:20px;letter-spacing:.02em}
.mast small{font-size:12px;font-weight:600;color:#6b6152}
.headline{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.15;text-wrap:balance}
.paper p{font-size:14.5px;color:#3b3428;line-height:1.5}

.phone{align-self:center;width:min(320px,100%);background:#05070b;border-radius:30px;padding:10px;border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.screen{background:#121823;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:230px}
.post{background:#1b2331;border-radius:12px;padding:9px 11px;font-size:14px;animation:rise .35s both}
.post b{font-size:13px}.post small{color:var(--dim)}
.post .lk{font-size:12px;color:var(--red);font-weight:700;margin-top:3px}
.timer{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.tbar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--red);transition:width 1s linear}

.mapWrap{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
@media (max-width:560px){.mapWrap{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block;border-radius:12px}
.map .d{cursor:pointer}
.dlist{display:flex;flex-direction:column;gap:6px}
.dbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14.5px;text-align:left}
.dbtn em{font-style:normal;font-weight:800}
.dbtn.low{border-color:rgba(255,107,107,.6);background:var(--red-s)}.dbtn.hi{border-color:rgba(90,209,154,.5);background:var(--green-s)}.dbtn.md{border-color:rgba(255,181,71,.5);background:var(--amber-s)}

.budget{display:flex;flex-direction:column;gap:6px}
.btrack{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bfill{height:100%;width:0;background:var(--green);transition:width .35s,background .3s}.bfill.over{background:var(--red)}
.blabel{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px}
.proj{text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.proj:hover:not(:disabled){border-color:var(--line2)}
.proj[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-s)}
.proj:disabled{cursor:default}
.proj h4{font-size:14.5px;font-weight:800;line-height:1.25}
.proj[aria-pressed="true"] h4::before{content:"✓ ";color:var(--amber)}
.proj .d{font-size:13px;color:var(--muted);line-height:1.35}
.rice{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.rice div{background:rgba(0,0,0,.25);border-radius:7px;padding:4px 2px;text-align:center}
.rice small{display:block;font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.rice b{font-size:13px;font-variant-numeric:tabular-nums}
.pfoot{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.score{color:var(--dim);font-size:13px}.score.on{color:#2a1a02;background:var(--amber);padding:1px 8px;border-radius:6px}
.formula{font-weight:800;font-size:14.5px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.race{display:flex;flex-direction:column;gap:12px}
.cand{display:grid;grid-template-columns:46px 1fr 54px;gap:10px;align-items:center}
.cand .ava{width:46px;height:46px;flex:none}
.cand small{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
.cand .tr{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.cand .tr i{display:block;height:100%;width:0;border-radius:7px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.cand b{font-weight:900;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}

/* MENU */
.intro{display:flex;flex-direction:column;gap:16px}
.intro h1 span{color:var(--amber)}
.lede{font-size:16.5px;color:#d5dce6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13.5px;color:var(--muted)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;font:inherit;font-weight:600;font-size:17px;color:var(--fg);background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;padding:0 14px;height:50px}
.inrow input::placeholder{color:var(--dim);font-weight:500}
.inrow input:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 3px var(--amber-s)}
.err{font-size:13px;color:var(--red);font-weight:600;min-height:18px}
.avatars{display:flex;gap:10px;flex-wrap:wrap}
.avbtn{width:62px;height:62px;border-radius:50%;padding:0;border:2px solid transparent;overflow:hidden;background:none;transition:transform .15s,border-color .15s}
.avbtn svg{width:100%;height:100%;display:block}
.avbtn[aria-pressed="true"]{border-color:var(--amber);transform:scale(1.06)}
.scens{display:flex;flex-direction:column;gap:9px}
.scen{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:12px;transition:border-color .15s,background .15s}
.scen:hover{border-color:var(--line2)}
.scen[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-s)}
.scen .ic{width:54px;height:54px;border-radius:12px;overflow:hidden}
.scen .ic svg{width:100%;height:100%;display:block}
.scen b{display:block;font-size:15.5px;font-weight:800}
.scen small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:2px}
.scen .lv{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.rules{font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.5}
.rules b{color:var(--fg)}
.best{font-size:13px;color:var(--muted);font-weight:600}

/* FINAL */
.final{display:flex;flex-direction:column;gap:16px}
.ending{border-radius:18px;padding:20px;background:linear-gradient(135deg,rgba(255,181,71,.22),rgba(255,181,71,.04));border:1px solid rgba(255,181,71,.4);display:flex;flex-direction:column;gap:8px}
.ending.lose{background:linear-gradient(135deg,rgba(255,107,107,.2),rgba(255,107,107,.03));border-color:rgba(255,107,107,.4)}
.ending .row2{display:flex;gap:14px;align-items:center}
.ending .ava{width:72px;height:72px;flex:0 0 72px}
.ending h2{font-size:clamp(24px,2.6vw,32px)}
.ending p{color:#e2e7ee;font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.cmp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--glass2)}
.cmp small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.cmp div{font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.cmp div b{font-size:19px;font-weight:900}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.badge{display:flex;gap:9px;align-items:center;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.badge svg{width:34px;height:34px;flex:0 0 34px}
.badge b{font-size:13px;line-height:1.2;display:block}.badge small{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.lessons{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lessons div{padding:10px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14.5px}
.lessons div:first-child{border-top:0}
.lessons small{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);padding-top:3px}
@media (max-width:480px){.lessons div{grid-template-columns:1fr;gap:2px}}
.cta{border-radius:18px;padding:18px;background:linear-gradient(135deg,#1f6b52,#14453a);border:1px solid rgba(90,209,154,.4);display:flex;flex-direction:column;gap:10px}
.cta .tag{background:rgba(255,255,255,.15);color:#fff;align-self:flex-start}
.cta h3{font-size:clamp(19px,2vw,23px);font-weight:900}
.cta p{color:#d9efe6;font-size:15px}
.gover{display:flex;flex-direction:column;gap:14px}
.gover .big{font-weight:900;font-size:clamp(30px,3.6vw,42px);color:var(--red);letter-spacing:-.02em;line-height:1.05}

.toasts{position:fixed;z-index:9;left:max(20px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - var(--panelW) - 60px));pointer-events:none}
@media (max-width:899px){.toasts{left:50%;transform:translateX(-50%);width:min(92vw,380px)}}
.toast{display:flex;gap:10px;align-items:center;background:rgba(16,22,34,.95);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .45s cubic-bezier(.2,.9,.3,1.2) both}
.toast.out{animation:tout .35s ease-in forwards}
.toast svg{width:36px;height:36px;flex:0 0 36px}
.toast b{font-size:14px;display:block}.toast small{display:block;font-size:12.5px;color:var(--muted)}
.toast.lv{border-color:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="city" aria-label="Панорама города, которая меняется от ваших решений"></canvas>

<header class="hud" id="hud">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M3 21V11h4v10M9 21V5h5v16M16 21V9h4v12" fill="#1c1204"/></svg></span>Мэр на данных</div>
  <a class="sr" href="https://t.me/skillroute1_bot" target="_blank" rel="noopener"><i>SR</i>Skill Route</a>
  <div class="chip" id="st-pop" title="Жители"><svg viewBox="0 0 24 24" fill="none" stroke="#6aa8ff" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.8 3.2-5.8 6.5-5.8s5.9 2 6.5 5.8"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.3c3 .2 4.9 1.9 5.5 5.2"/></svg><b>—</b><small>жители</small></div>
  <div class="chip" id="st-happy" title="Счастье жителей"><svg viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14.5c1.8 2.3 6.2 2.3 8 0" stroke-linecap="round"/><circle cx="9" cy="10" r=".6" fill="#ffb547"/><circle cx="15" cy="10" r=".6" fill="#ffb547"/></svg><b>—</b><small>счастье</small></div>
  <div class="chip" id="st-budget" title="Бюджет"><svg viewBox="0 0 24 24" fill="none" stroke="#5ad19a" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/></svg><b>—</b><small>бюджет</small></div>
  <div class="chip" id="st-trust" title="Доверие команды"><svg viewBox="0 0 24 24" fill="none" stroke="#ff6b9a" stroke-width="2"><path d="M12 20s-8-4.8-8-10.4A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.6C20 15.2 12 20 12 20z" stroke-linejoin="round"/></svg><b>—</b><small>доверие</small></div>
  <div class="chip" id="st-month" title="Месяц срока"><svg viewBox="0 0 24 24" fill="none" stroke="#c3cbd8" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><b>0/24</b></div>
  <button class="chip sound" id="soundBtn" aria-pressed="true" aria-label="Музыка" title="Музыка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span id="soundTxt">Музыка</span></button>
</header>

<div class="cityInfo" id="cityInfo"><div class="nm" id="cityName">Мэр на данных</div><div class="sub" id="citySub">Выберите город</div><div class="dots" id="dots"></div></div>

<section class="panel" aria-label="Игра">
  <div class="phead">
    <div class="ttl"><b id="pTitle">Мэр на данных</b><small id="pSub">Квест для будущих продактов</small></div>
    <div class="lvl" title="Уровень продакта"><b id="lvlTxt">Стажёр · 0 XP</b><div class="lvlbar"><i id="lvlBar"></i></div></div>
    <div class="streak" id="streak" data-n="0" title="Серия верных решений"><svg viewBox="0 0 24 24"><path d="M12 22c-4.2 0-7-2.8-7-6.6 0-3.3 2.4-5.2 3.3-7.6.9 1.9 1.9 2.8 2.8 2.8 0-2.8.9-5.6 3.8-7.6-.5 2.8 4.1 5.6 4.1 12.4 0 3.8-2.8 6.6-7 6.6z" fill="#ff9a3c"/><path d="M12 22c-1.9 0-3.3-1.4-3.3-3.3s1.4-3.3 2.4-5.2c.9 1.9 4.2 2.8 4.2 5.2S13.9 22 12 22z" fill="#ffd166"/></svg><span id="streakTxt">×0</span></div>
  </div>
  <main id="stage" aria-live="polite"></main>
</section>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile=()=>innerWidth<900;
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
function hexMix(c1,c2,k){const a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);const h=v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0');return'#'+h(lerp(a>>16,b>>16,k))+h(lerp(a>>8&255,b>>8&255,k))+h(lerp(a&255,b&255,k));}
const shade=(c,k)=>k>=0?hexMix(c,'#ffffff',k):hexMix(c,'#000000',-k);
class GameOver extends Error{constructor(r){super('gameover');this.r=r;}}

/* =============== SOUND =============== */
const Sound=(()=>{
  let ac=null,master,rev,on=true,timer=null,step=0;
  try{on=localStorage.getItem('mayor-sound')!=='off';}catch(e){}
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function init(){if(ac)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=new AC();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    rev=ac.createConvolver();const len=Math.floor(ac.sampleRate*3.4),buf=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
    rev.buffer=buf;const rg=ac.createGain();rg.gain.value=.5;rev.connect(rg);rg.connect(master);}
  const CH=[[57,60,64,67],[53,57,60,64],[48,55,59,64],[52,55,59,62]];
  const PENT=[69,72,74,76,79,81,84,86];
  function pad(notes,t0,dur){
    notes.forEach(m=>{['sine','triangle'].forEach((type,k)=>{const o=ac.createOscillator();o.type=type;o.frequency.value=mf(m);o.detune.value=k?7:-5;
      const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=950;const g=ac.createGain();const pk=k?.010:.016;
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(pk,t0+2.6);g.gain.setValueAtTime(pk,t0+dur-2);g.gain.linearRampToValueAtTime(0,t0+dur+1.8);
      o.connect(f);f.connect(g);g.connect(master);g.connect(rev);o.start(t0);o.stop(t0+dur+2);});});
    const o=ac.createOscillator();o.type='sine';o.frequency.value=mf(notes[0]-12);const g=ac.createGain();
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.028,t0+1.6);g.gain.linearRampToValueAtTime(0,t0+dur+1);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+1.2);}
  function pluck(m,t0,vol=.028,dec=2.4){const o=ac.createOscillator();o.type='sine';o.frequency.value=mf(m);const g=ac.createGain();
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dec);o.connect(g);g.connect(master);g.connect(rev);o.start(t0);o.stop(t0+dec+.1);}
  function bar(){if(!ac||!on)return;const t0=ac.currentTime+.05,dur=8;pad(CH[step%4],t0,dur);step++;
    const n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)pluck(PENT[Math.floor(Math.random()*PENT.length)],t0+.8+Math.random()*6.6);}
  function start(){init();if(!ac)return;if(ac.state==='suspended')ac.resume();if(!on)return;
    master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);master.gain.linearRampToValueAtTime(.85,ac.currentTime+2.5);
    if(!timer){bar();timer=setInterval(bar,8000);}}
  function stop(){if(!ac)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);master.gain.linearRampToValueAtTime(0,ac.currentTime+.5);clearInterval(timer);timer=null;}
  function toggle(){on=!on;try{localStorage.setItem('mayor-sound',on?'on':'off');}catch(e){}on?start():stop();return on;}
  function sfx(k){if(!ac||!on)return;const t=ac.currentTime+.01;
    if(k==='ok'){pluck(81,t,.05,1.4);pluck(88,t+.11,.04,1.6);}
    else if(k==='bad'){const o=ac.createOscillator();o.type='triangle';o.frequency.setValueAtTime(196,t);o.frequency.exponentialRampToValueAtTime(98,t+.55);const g=ac.createGain();g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.8);o.connect(g);g.connect(master);o.start(t);o.stop(t+.85);}
    else if(k==='lvl'){[72,76,79,84].forEach((m,i)=>pluck(m,t+i*.09,.045,1.6));}
    else if(k==='tap'){pluck(93,t,.010,.25);}
    else if(k==='over'){[64,60,57,52].forEach((m,i)=>pluck(m,t+i*.22,.05,2.2));}}
  document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(on)ac.resume();});
  return{start,toggle,sfx,get on(){return on;}};
})();
const sBtn=$('#soundBtn');
function syncSound(){sBtn.setAttribute('aria-pressed',Sound.on?'true':'false');$('#soundTxt').textContent=Sound.on?'Музыка':'Тихо';}
sBtn.onclick=()=>{Sound.toggle();syncSound();};syncSound();
(()=>{const kick=e=>{if(e&&e.target&&e.target.closest&&e.target.closest('#soundBtn'))return;if(Sound.on)Sound.start();['pointerdown','touchend','keydown','click'].forEach(t=>document.removeEventListener(t,kick,true));};['pointerdown','touchend','keydown','click'].forEach(t=>document.addEventListener(t,kick,true));})();

/* =============== FACES =============== */
let UID=0;
function face(o,mood='neutral',noBg=false){
  const f=Object.assign({skin:'#f1c6a6',hair:'short',hc:'#3a2a20',shirt:'#3a7bd5',eye:'#4a3426',bg:'#334'},o);const u='u'+(UID++);
  const sk=f.skin,dk=shade(sk,-.22),lips=hexMix(sk,'#b5525a',.45),hcD=shade(f.hc,-.28),brow=f.hair==='bald'?'#8d8a92':shade(f.hc,-.15);
  let s=`<defs><radialGradient id="${u}s" cx=".42" cy=".36" r=".7"><stop offset="0" stop-color="${shade(sk,.16)}"/><stop offset=".7" stop-color="${sk}"/><stop offset="1" stop-color="${shade(sk,-.16)}"/></radialGradient>

function addXP(n){if(!n)return;const b=levelOf(S.xp);S.xp=Math.max(0,S.xp+n);const a=levelOf(S.xp);renderHud();
  if(a>b)setTimeout(()=>{Sound.sfx('lvl');city.good(true);toast(`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#ffb547"/><path d="M20 10l8 9h-5v10h-6V19h-5z" fill="#1c1204"/></svg><div><b>Новый уровень: ${LEVELS[a].n}</b><small>Вы растёте как продакт</small></div>`,'lv',3400);},450);}
function score(kind,pts){S.total++;let g=0;
  if(kind==='ok'){S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);g=pts+(S.streak>=3?4:0);if(S.streak===5)achieve('streak5');Sound.sfx('ok');}
  else if(kind==='mid'){S.streak=0;g=Math.round(pts/2);S.correct+=.5;Sound.sfx('tap');}
  else{S.streak=0;Sound.sfx('bad');}
  addXP(g);return g;}

/* =============== DOM HELPERS =============== */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function reveal(n){requestAnimationFrame(()=>{const top=n.offsetTop,bot=top+n.offsetHeight,vt=stage.scrollTop,vh=stage.clientHeight;
  let target=null;if(bot>vt+vh-8)target=Math.min(top-12,bot-vh+20);else if(top<vt)target=top-12;
  if(target!=null)stage.scrollTo({top:Math.max(0,target),behavior:reduce?'auto':'smooth'});});}
function follow(){const gap=stage.scrollHeight-stage.scrollTop-stage.clientHeight;if(gap>0&&gap<160)stage.scrollTop=stage.scrollHeight;}
function clearStage(){stage.innerHTML='';stage.scrollTop=0;}
function add(n){stage.appendChild(n);reveal(n);return n;}
function card(html){return add(el('div','card',html));}
let skipNow=false,typing=0;
stage.addEventListener('click',e=>{if(typing&&!e.target.closest('button,a,input'))skipNow=true;});
function type(node,text){return new Promise(res=>{
  if(reduce){node.textContent=text;res();return;}
  let i=0;typing++;node.classList.add('typing');
  const done=()=>{node.textContent=text;node.classList.remove('typing');typing=Math.max(0,typing-1);skipNow=false;follow();res();};
  const step=()=>{if(skipNow)return done();i+=3;node.textContent=text.slice(0,i);follow();if(i>=text.length)return done();setTimeout(step,16);};step();});}
async function say(who,text,mood='neutral'){const p=P[who];const row=el('div','line');row.append(el('div','ava',faceSvg(p.f,mood)));

function choiceList(opts){return new Promise(res=>{const box=el('div','choices');
  opts.forEach((o,i)=>{const b=el('button','choice',`<span class="key">${'ABCDE'[i]}</span><span>${o.t}</span>`);
    b.onclick=()=>{[...box.children].forEach(c=>c.disabled=true);const k=o.ok===true?'ok':o.ok==='mid'?'mid':'bad';b.classList.add('picked',k);
      if(k!=='ok'){const r=opts.findIndex(x=>x.ok===true);if(r>-1)box.children[r].classList.add('right');}res(o);};box.appendChild(b);});add(box);});}
const VERD={ok:['Решение по данным','В точку','Сильный ход'],mid:['Наполовину','Есть нюанс'],bad:['Мимо','Ошибка','Плохая идея']};
function feedback({kind,title,why,lesson,xp,tag}){if(lesson)S.lessons.push({tag:tag||SCEN[S.scen].tagOf(S.ci),text:lesson});
  return new Promise(res=>{const v=VERD[kind][Math.floor(Math.random()*VERD[kind].length)];
    const f=el('div','fb '+kind,`<div class="fbTop"><span class="verdict">${v}</span>${xp?`<span class="xp">+${xp} XP${S.streak>=3&&kind==='ok'?` · серия ×${S.streak}`:''}</span>`:''}</div>${title?`<h3>${title}</h3>`:''}${why?`<p>${why}</p>`:''}${lesson?`<div class="lesson"><span>Урок продакта</span><p>${lesson}</p></div>`:''}`);

async function quiz(opts,{pts=10,hint,ach,tag}={}){
  if(hint)hintOffer(hint);
  const o=await choiceList(opts);
  if(o.fatal){Sound.sfx('bad');if(o.fx)apply(o.fx,'bad');await sleep(500);throw new GameOver(o.fatal);}
  const kind=o.ok===true?'ok':o.ok==='mid'?'mid':'bad';const xp=score(kind,pts);
  if(o.flag)[].concat(o.flag).forEach(f=>S.flags[f]=true);
  if(kind==='ok'&&ach)achieve(ach);
  apply(o.fx||{},kind==='ok'?'ok':kind==='bad'?'bad':null);
  if(o.react)await say(o.react[0],o.react[1],o.react[2]);
  await feedback({kind,title:o.title,why:o.why,lesson:o.lesson,xp,tag});
  guard();return o;}

/* line/bar chart svg (dark) */
function chartSvg({labels,series,yMax,yStep,unit='',type='line',hl=[],w=560,h=230,goal}){
  const L=40,R=12,T=14,B=28,x=i=>L+(type==='bar'?(i+.5)*(w-L-R)/labels.length:i*(w-L-R)/(labels.length-1)),y=v=>T+(1-v/yMax)*(h-T-B);
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;min-width:340px;display:block" role="img">`;
  for(let v=0;v<=yMax;v+=yStep)s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${L-8}" y="${y(v)+4}" fill="#8592a6" font-size="11.5" font-family="Golos Text" text-anchor="end">${v}${unit}</text>`;
  const step=Math.ceil(labels.length/12);labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${x(i)}" y="${h-8}" fill="#8592a6" font-size="11.5" font-family="Golos Text" text-anchor="middle">${l}</text>`;});
  if(goal!=null)s+=`<line x1="${L}" x2="${w-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#5ad19a" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${w-R}" y="${y(goal)-6}" fill="#5ad19a" font-size="11.5" font-weight="700" font-family="Golos Text" text-anchor="end">норма ${goal}${unit}</text>`;
  series.forEach(se=>{if(type==='bar'){const bw=(w-L-R)/labels.length*.62;se.v.forEach((v,i)=>{s+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="4" fill="${hl.includes(i)?se.hc||'#ffb547':se.c}"/>`;});}
    else{s+=`<path d="${se.v.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('')}" fill="none" stroke="${se.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
      s+=`<path d="${se.v.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('')}L${x(se.v.length-1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="${se.c}" opacity=".1"/>`;}});
  return s+'</svg>';}

async function election(){const c=SCEN[S.scen];S.ci=c.chapters.length;head('Ночь выборов',24,.95);renderDots();
  const acc=S.total?S.correct/S.total*100:50;
  const ap=clamp(12+S.happy*.4+S.trust*.22+(S.pop/S.pop0-1)*150+(acc-50)*.16,20,84);
  await say('gromov',ap>=50?'Я выдвинулся против вас, мэр. Но, честно говоря, кое-что у вас получилось.':'Я выдвинулся против вас, мэр. Город устал от ваших таблиц!',ap>=50?'neutral':'happy');
  await narr('Избирательные участки закрыты. Идёт подсчёт голосов по районам…');
  card(`<div class="race"><div class="cand"><div class="ava">${faceSvg(MAYORS[S.av],'neutral')}</div><div><small>Мэр ${esc(S.name)}</small><div class="tr"><i id="rA" style="background:var(--green)"></i></div></div><b id="rAv">0%</b></div>
    <div class="cand"><div class="ava">${faceSvg(P.gromov.f,'neutral')}</div><div><small>Громов</small><div class="tr"><i id="rB" style="background:var(--red)"></i></div></div><b id="rBv">0%</b></div><div class="cap" id="rD">Подсчитано районов: 0 из 5</div></div>`);
  let sum=0;for(let i=0;i<5;i++){await sleep(900);const sh=i===4?(S.flags[c.special]?6:-16):[3,1,-2,2,0][i];const a=clamp(ap+sh,10,90);sum+=a;const avg=sum/(i+1);
    $('#rA').style.width=avg+'%';$('#rB').style.width=(100-avg)+'%';$('#rAv').textContent=Math.round(avg)+'%';$('#rBv').textContent=Math.round(100-avg)+'%';
    $('#rD').textContent=`Подсчитано районов: ${i+1} из 5 · ${c.districts[i]}: ${Math.round(a)}% за мэра`;Sound.sfx('tap');}
  S.final=sum/5;await sleep(700);}
function cta(){return `<div class="cta"><span class="tag">Skill Route · школа продактов</span><h3>Принимайте такие решения не в игре, а в реальном продукте</h3><p>Метрики, интервью, гипотезы, A/B-тесты и приоритизация — база профессии продакт-менеджера. В Skill Route её разбирают на живых кейсах с практиками, а в конце у вас портфолио и понятный путь в профессию.</p><div class="row"><a class="btn" href="https://t.me/skillroute1_bot" target="_blank" rel="noopener">Записаться на курс</a><a class="btn ghost" href="https://t.me/product_vibe_it" target="_blank" rel="noopener">Telegram-канал</a><a class="btn ghost" href="https://instagram.com/skill.route" target="_blank" rel="noopener">Instagram</a></div><p style="font-size:13.5px">Напишите боту @skillroute1_bot «Привет» — расскажем про программу и подберём поток.</p></div>`;}

function lessonsHtml(){if(!S.lessons.length)return'';return `<h3>Что вы прокачали</h3><div class="lessons">${S.lessons.map(l=>`<div><small>${l.tag}</small><span>${l.text}</span></div>`).join('')}</div>`;}

    :['Город выбрал Громова',`${Math.round(v)}% — ${c.city} выбрал Громова. Первым указом он заказал второе колесо обозрения. Пройдите ещё раз и дайте слово данным.`];

  const r=el('div','row');const again=el('button','btn big','Сыграть другой город');again.onclick=()=>boot();const same=el('button','btn ghost big','Этот город заново');same.onclick=()=>startScenario(S.scen,S.name,S.av);r.append(again,same);f.appendChild(r);add(f);stage.scrollTop=0;}

    <p class="lede">Вас избрали мэром. Впереди 24 месяца, команда с громкими мнениями и выборы в финале. Принимайте решения как продакт-менеджер: через метрики, интервью, гипотезы и эксперименты. Одно неверное решение может закончить срок досрочно.</p>

  stage.appendChild(box);

  const scs=box.querySelector('#scs');

  const upd=()=>{go.disabled=!(inp.value.trim()&&ct.value.trim()&&sc);};upd();

  await new Promise(r=>go.onclick=()=>{if(check())r();});
  const pc=parseContact(ct.value);PLAYER={name:inp.value.trim(),c:pc.c,t:pc.t};
  try{localStorage.setItem('mayor-player',JSON.stringify({name:PLAYER.name,raw:ct.value.trim()}));}catch(e){}
  Sound.start();syncSound();startScenario(sc,PLAYER.name,av);}
function parseContact(v){v=(v||'').trim();if(!v)return null;
  if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return{c:v.toLowerCase(),t:'email'};
  const m=v.match(/^(?:https?:\/\/)?(?:t\.me|telegram\.me)\/([A-Za-z0-9_]{5,32})\/?$/i)||v.match(/^@?([A-Za-z0-9_]{5,32})$/);
  return m?{c:'@'+m[1],t:'telegram'}:null;}
